services:
  talent-copilot:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/talent-copilot.db"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      APP_ACCESS_CODE: "${APP_ACCESS_CODE:-change-me}"
      AUTH_SECRET: "${AUTH_SECRET:-replace-with-a-long-random-secret}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
    volumes:
      - talent_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  talent_data:
